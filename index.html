    <script type="text/javascript">
        // Giải mã và chuyển đổi URL từ query parameter thành URL chuẩn sạch sẽ
        (function (l) {
            if (l.search[1] === 'p') {
                var pairs = l.search.slice(1).split('&');
                var query = pairs.query;
                if (pairs[0].split('=')[0] === 'p') {
                    query = pairs[0].split('=')[1].replace(/~and~/g, '&');
                }
                window.history.replaceState(null, null,
                    l.pathname.slice(0, -1) + '/' + query + (l.hash || '')
                );
            }
        }(window.location));
    </script>
